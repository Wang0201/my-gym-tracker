<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>72kg Project Beta5</title><style>body{background:#080a0f;color:white;font-family:-apple-system;padding:16px}.card{background:#151922;border-radius:22px;padding:16px;margin-bottom:14px}.item{background:#10141a;padding:14px;border-radius:14px;margin:10px 0}</style></head><body><div class='card'><h1>💪72kg Project</h1><p>V2.2 Pro Beta5</p></div><div class='card'><h2>🎬动作播放器</h2><video controls playsinline width='100%'></video></div><div class='card'><h2>训练列表</h2><div id='list'></div></div><script>fetch('data/exercises.json').then(r=>r.json()).then(d=>list.innerHTML=d.map(x=>`<div class='item'><b>${x.name}</b><br>${x.mode}<br>${x.muscle}<br>${x.sets}组×${x.reps}</div>`).join(''))</script></body></html>
