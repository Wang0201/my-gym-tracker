<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>
72kg Project V3.0 Alpha
</title>

<style>

body{
font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
sans-serif;

background:#f2f2f7;

margin:0;
padding:16px;
}


.card{

background:white;

border-radius:22px;

padding:18px;

margin-bottom:16px;

box-shadow:
0 3px 10px rgba(0,0,0,.05);

}


h1{

font-size:28px;

}


.item{

padding:14px 0;

border-bottom:
1px solid #eee;

}


input{

width:55px;

padding:8px;

border-radius:8px;

border:
1px solid #ddd;

}


button{

width:100%;

padding:14px;

border:0;

border-radius:14px;

background:#111;

color:white;

font-size:16px;

}


.stat{

font-size:20px;

font-weight:bold;

}


</style>

</head>


<body>


<div class="card">

<h1>
💪72kg Project
</h1>

<p>
Hypertrophy Tracker V3.0 Alpha
</p>

<p>
64kg → 72kg 增肌计划
</p>

</div>



<div class="card">

<h2>
📅 今日训练
</h2>

<div id="plan">

加载中...

</div>

</div>



<div class="card">

<h2>
📝 训练记录
</h2>


<div id="log">

</div>


<br>

<div class="stat">

训练容量：

<span id="volume">
0
</span>

kg

</div>


<br>


<div class="stat">

完成组数：

<span id="sets">
0
</span>

组

</div>


</div>




<script>


let volume=0;

let sets=0;



fetch(
"data/workouts.json"
)

.then(
r=>r.json()
)

.then(
data=>{


let day=[

"sun",

"mon",

"tue",

"wed",

"thu",

"fri",

"sat"

][new Date().getDay()];



let workout=data[day];



document
.getElementById("plan")
.innerHTML=


`

<h3>
${workout.name}
</h3>


${
workout.items
.map(

(x,i)=>`

<div class="item">

<b>
${x}
</b>


<br><br>


重量

<input

id="weight${i}"

value="10">

kg



次数

<input

id="rep${i}"

value="12">


<br><br>


<button

onclick="finish('${x}',${i})">

完成一组

</button>


</div>

`

)
.join("")
}


`;



}

);



function finish(name,index){


let w=

Number(

document

.getElementById(

"weight"+index

)

.value);



let r=

Number(

document

.getElementById(

"rep"+index

)

.value);



volume += w*r;


sets++;



document

.getElementById(

"volume"

)

.innerHTML=

volume;



document

.getElementById(

"sets"

)

.innerHTML=

sets;



document

.getElementById(

"log"

)

.innerHTML

+=

`

✅ ${name}

${w}kg × ${r}

<br>

`;



}


</script>


</body>

</html>
