<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover">


<title>
Muscle Journey V3
</title>


<link rel="stylesheet"
href="css/style.css">


</head>



<body>


<div class="app">


<!-- 顶部成长卡 -->

<section class="hero card">


<div class="brand">

🦾 Muscle Journey

</div>


<p class="subtitle">

12个月增肌成长系统

</p>



<div class="level">

Lv.<span id="level">
1
</span>

肌肉建设者

</div>




<div class="weight">

<span id="currentWeight">

64.0

</span>

<small>
kg
</small>

</div>


<p>

目标：
75kg

</p>




<div class="progress">

<div id="goalProgress"></div>

</div>



<div class="goal-text">

距离目标：
<span id="remain">

10.8

</span>

kg

</div>



<div class="stats">


<div>

🔥

<b id="streak">

0

</b>

<br>

连续训练

</div>



<div>

⭐

<b id="xp">

0

</b>

<br>

XP

</div>



<div>

💪

<b id="workouts">

0

</b>

<br>

训练次数

</div>



</div>



</section>







<!-- 今日训练 -->


<section class="card">


<h2>

🎯 今日任务

</h2>


<div class="training-card">


<h3>

上肢增肌 A

</h3>


<p>

哑铃卧推

</p>


<p>

单臂划船

</p>


<p>

肩推

</p>


<p>

侧平举

</p>


</div>



<button onclick="completeWorkout()">

完成训练 +50 XP

</button>


</section>









<!-- 体重 -->


<section class="card">


<h2>

⚖️ 体重记录

</h2>


<input

id="weightInput"

placeholder="输入今日体重 kg">


<button onclick="saveWeight()">

保存

</button>



<div id="weightHistory">

</div>



</section>









<!-- 饮食 -->


<section class="card">


<h2>

🍚 今日营养

</h2>


<div class="nutrition">


蛋白质

<div class="nutrition-bar">

<div id="proteinBar">

</div>

</div>


130g


<br><br>


热量

<div class="nutrition-bar">

<div id="calorieBar">

</div>

</div>


2800 kcal


</div>



</section>








<!-- 成就 -->


<section class="card">


<h2>

🏆 成就

</h2>


<div id="achievementList">

</div>



</section>







</div>






<script src="js/storage.js"></script>

<script src="js/workout.js"></script>

<script src="js/weight.js"></script>

<script src="js/nutrition.js"></script>

<script src="js/achievement.js"></script>

<script src="js/app.js"></script>


</body>


</html>
